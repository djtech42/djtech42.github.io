<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lily Leap</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #12241a;
      overflow: hidden;
      touch-action: none;
    }
    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    /* The area the game fits into. game.js picks the view's width to match its shape. */
    #stage {
      box-sizing: border-box;
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    /* Phones held upright: the game sits above the on-screen controls instead of under them */
    @media (orientation: portrait) {
      body.touch:not(.pad) #stage {
        padding-bottom: calc(max(16px, env(safe-area-inset-bottom)) + min(80px, 19vw) + 16px);
      }
    }
    canvas {
      display: block;
      border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }

    /* On-screen controls, shown once the screen is touched */
    #touch {
      display: none;
    }
    body.touch #touch {
      display: block;
    }
    /* Hidden again while a gamepad is in use (e.g. a controller paired to a tablet) */
    body.touch.pad #touch {
      display: none;
    }
    #touch .cluster {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #touch .left {
      left: max(16px, env(safe-area-inset-left));
    }
    #touch .right {
      right: max(16px, env(safe-area-inset-right));
    }
    #touch button {
      width: min(64px, 15vw);
      height: min(64px, 15vw);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      background: rgba(20, 40, 30, 0.35);
      color: #fff;
      font: bold 22px "Trebuchet MS", system-ui, sans-serif;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(2px);
    }
    #touch button.on {
      background: rgba(155, 224, 125, 0.45);
      border-color: #d8f5c8;
    }
    #touch .label {
      font-size: 14px;
    }
    #touch .jump {
      width: min(80px, 19vw);
      height: min(80px, 19vw);
      font-size: 16px;
    }
    #touch .pause {
      display: none;
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      font-size: 14px;
    }
    body.in-level #touch .pause {
      display: block;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540" tabindex="0"></canvas>
  </div>
  <div id="touch" aria-hidden="true">
    <div class="cluster left">
      <button data-key="TouchLeft">◀</button>
      <button data-key="TouchDown">▼</button>
      <button data-key="TouchRight">▶</button>
    </div>
    <div class="cluster right">
      <button data-key="TouchTongue" class="label">Tongue</button>
      <button data-key="TouchJump" class="jump">Jump</button>
    </div>
    <button data-key="TouchPause" class="pause">❚❚</button>
  </div>
  <script src="levels.js"></script>
  <script src="music.js"></script>
  <script src="game.js"></script>
</body>
</html>
